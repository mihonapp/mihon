name: Release
on:
  push:
    tags:
      - v*

permissions:
  contents: write

env:
  KOMIKITA_GITHUB_RELEASE: true
  RELEASE_TAG: ${{ github.ref_name }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'BaghasWahyu/komikita'
    name: Build
    runs-on: 'ubuntu-26.04'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Decode signing keystore
        run: echo "$SIGNING_KEY" | base64 -d > "${{ runner.temp }}/komikita.keystore"
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}

      - name: Build
        run: ./gradlew assembleRelease -Pdist=github -Penable-updater=true
        env:
          storeFile: ${{ runner.temp }}/komikita.keystore
          storePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyAlias: ${{ secrets.ALIAS }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Verify APK versions
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          expected = tag.removeprefix("v")
          metadata = Path("app/build/outputs/apk/release/output-metadata.json")
          outputs = json.loads(metadata.read_text(encoding="utf-8"))["elements"]
          if not outputs:
              raise SystemExit("Gradle did not report any release APKs.")
          for output in outputs:
              actual = output["versionName"]
              if actual != expected:
                  raise SystemExit(f"{output['outputFile']} has versionName {actual}, but tag {tag} requires {expected}.")
          PY

      - name: Rename APK
        run: |
          set -e

          mv app/build/outputs/apk/release/app-universal-release.apk "komikita-${RELEASE_TAG}.apk"
          mv app/build/outputs/apk/release/app-arm64-v8a-release.apk "komikita-arm64-v8a-${RELEASE_TAG}.apk"
          mv app/build/outputs/apk/release/app-armeabi-v7a-release.apk "komikita-armeabi-v7a-${RELEASE_TAG}.apk"
          mv app/build/outputs/apk/release/app-x86-release.apk "komikita-x86-${RELEASE_TAG}.apk"
          mv app/build/outputs/apk/release/app-x86_64-release.apk "komikita-x86_64-${RELEASE_TAG}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: komikita
          path: |
            komikita-${{ env.RELEASE_TAG }}.apk
            komikita-arm64-v8a-${{ env.RELEASE_TAG }}.apk
            komikita-armeabi-v7a-${{ env.RELEASE_TAG }}.apk
            komikita-x86-${{ env.RELEASE_TAG }}.apk
            komikita-x86_64-${{ env.RELEASE_TAG }}.apk

  release:
    if: github.repository == 'BaghasWahyu/komikita'
    name: Create GitHub Release
    runs-on: ubuntu-26.04
    needs: build

    steps:
      - name: Checkout release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' \
            > "$RUNNER_TEMP/published-release-tags.txt"
          python3 .github/scripts/generate_release_notes.py \
            --tag "$RELEASE_TAG" \
            --repository "$GITHUB_REPOSITORY" \
            --published-tags "$RUNNER_TEMP/published-release-tags.txt" \
            --output "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true

      - name: Delete all artifacts
        uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118 # v6.0.0
        with:
          failOnError: false
          name: komikita

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: KomiKita ${{ env.RELEASE_TAG }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: |
            komikita-${{ env.RELEASE_TAG }}.apk
            komikita-arm64-v8a-${{ env.RELEASE_TAG }}.apk
            komikita-armeabi-v7a-${{ env.RELEASE_TAG }}.apk
            komikita-x86-${{ env.RELEASE_TAG }}.apk
            komikita-x86_64-${{ env.RELEASE_TAG }}.apk
          draft: true
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
