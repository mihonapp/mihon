name: Release
on:
  push:
    tags:
      - v*

# Mekuri: tag vX.Y.Z -> signed APKs -> published GitHub Release in this repo.
# The in-app update checker reads /releases/latest of vsrksaketh-dev/mekuri.
env:
  MIHON_GITHUB_RELEASE: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'vsrksaketh-dev/mekuri'
    name: Build & publish release
    runs-on: 'ubuntu-26.04'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get tag name
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Decode signing keystore
        run: echo "$SIGNING_KEY" | base64 -d > "${{ runner.temp }}/release.keystore"
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}

      - name: Build
        run: ./gradlew assembleRelease -Pinclude-telemetry=false -Penable-updater=true
        env:
          storeFile: ${{ runner.temp }}/release.keystore
          storePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyAlias: ${{ secrets.ALIAS }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APKs
        run: |
          set -e
          T=${{ steps.tag.outputs.tag }}
          D=app/build/outputs/apk/release
          # Mekuri: publish just two APKs - universal (any device) and arm64 (smaller, most phones).
          mv $D/app-universal-release.apk   mekuri-$T.apk
          mv $D/app-arm64-v8a-release.apk   mekuri-arm64-v8a-$T.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Mekuri ${{ steps.tag.outputs.tag }}
          body: |
            Personal build of Mekuri, a fork of [Mihon](https://github.com/mihonapp/mihon).

            > [!TIP]
            > Not sure which file to download? Use `mekuri-${{ steps.tag.outputs.tag }}.apk` (works on every device). `arm64-v8a` is a smaller build for most modern phones.
          files: |
            mekuri-${{ steps.tag.outputs.tag }}.apk
            mekuri-arm64-v8a-${{ steps.tag.outputs.tag }}.apk
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true
