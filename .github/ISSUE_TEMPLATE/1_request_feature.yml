name: 功能建议
description: 为 MihonW 的 Windows 使用体验提出改进建议
labels: [feature request]
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与遇到的问题
      description: 描述希望完成的操作，以及当前不方便的地方。
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 期望的改进
      description: 可以附示例、截图，或 Mihon / Suwayomi 对应功能的说明。
    validations:
      required: true
  - type: checkboxes
    id: searched
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索本仓库已有建议，未找到相同请求。
          required: true
