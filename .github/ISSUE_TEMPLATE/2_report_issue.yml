name: 问题反馈
description: 报告 mihondesk 在 Windows 上的运行、阅读或扩展兼容问题
labels: [bug]
body:
  - type: input
    id: mihondesk-version
    attributes:
      label: 应用版本
      placeholder: 例如 0.2.10；自行构建请附提交号
    validations:
      required: true
  - type: input
    id: windows-version
    attributes:
      label: Windows 版本
      description: 可按 Win + R，输入 winver 查看。
      placeholder: 例如 Windows 11 24H2，x64
    validations:
      required: true
  - type: dropdown
    id: distribution
    attributes:
      label: 安装方式
      options:
        - EXE 安装版
        - MSI 安装版
        - 便携 ZIP
        - 自行构建
    validations:
      required: true
  - type: textarea
    id: reproduce-steps
    attributes:
      label: 复现步骤
      description: 从打开程序开始，说明如何触发问题。
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……
    validations:
      required: true
  - type: textarea
    id: expected-and-actual
    attributes:
      label: 预期结果与实际结果
      description: 描述原本期待的行为，以及实际出现的问题。
    validations:
      required: true
  - type: input
    id: extension
    attributes:
      label: 图源与扩展版本
      description: 图源相关问题请填写图源名称、扩展版本和出错域名。
  - type: textarea
    id: logs
    attributes:
      label: 错误信息、截图或日志
      description: 请附完整错误文字或截图；分享日志前请移除账号、Cookie、令牌等个人信息。
  - type: checkboxes
    id: searched
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索本仓库已有问题，并查看当前版本的已知限制。
          required: true
