query ShikimoriSearchManga(
  $search: String!
) {
  mangas(
    search: $search,
    limit: 20,
    kind:"!light_novel,!novel"
  ) {
    id
    name
    chapters
    kind
    poster {
      mainUrl
    }
    score
    url
    status
    airedOn {
      date
    }
    description
    personRoles {
      person {
        name
      }
      rolesEn
    }
  }
}
