query ShikimoriGetMangaDetails(
  $query: String!,
) {
  mangas(
    ids: $query,
    limit: 1,
    kind: "!light_novel,!novel",
  ) {
    id
    name
    chapters
    kind
    poster {
      mainUrl
    }
    score
    url
    status
    airedOn {
      date
    }
    description
    personRoles {
      person {
        name
      }
      rolesEn
    }
  }
}
